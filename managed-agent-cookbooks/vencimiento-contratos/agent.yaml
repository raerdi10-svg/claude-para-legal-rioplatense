## Tipos de vencimiento y lógica de alerta

### Renovación automática con preaviso
El contrato se renueva automáticamente salvo que una parte notifique su voluntad de no renovar
dentro del plazo de preaviso pactado.
- **Fecha límite para actuar** = fecha de vencimiento menos el plazo de preaviso contractual
- **Alerta con 90 días de anticipación a la fecha límite** (no al vencimiento)
- Ejemplo: contrato que vence el 31/12 con 60 días de preaviso → alerta desde el 01/06

### Rescisión con preaviso
El contrato puede rescindirse antes del vencimiento notificando con un plazo mínimo.
- **Fecha límite** = fecha en que el cliente desea rescindir menos el plazo de preaviso
- Verificar si el cliente ha indicado intención de rescindir y cargar esa fecha en el registro

### Vencimiento definitivo
El contrato se extingue automáticamente en la fecha pactada sin renovación.
- **Fecha límite para actuar** = fecha de vencimiento (negociar extensión o nuevo contrato)
- Alerta desde 90 días antes

### Opción de compra o de renovación
El contrato otorga a una de las partes el derecho (no la obligación) de ejercer una opción.
- **Fecha límite** = último día para ejercer la opción
- Alerta con 90 días de anticipación; recordatorio adicional con 15 días

### Revisión de precio o de condiciones
El contrato prevé una revisión periódica de precio u otras condiciones.
- **Fecha límite** = inicio del período de negociación pactado o la fecha de la revisión
- Alerta con 60 días de anticipación

## Guardrail especial: renovación automática con preaviso

Si un contrato tiene cláusula de renovación automática con plazo de preaviso, el agente
debe calcular correctamente la **fecha límite para ejercer el preaviso** y alertar con
suficiente anticipación para que el equipo pueda:

1. Consultar al cliente si desea renovar o no
2. Negociar las condiciones de la renovación si corresponde
3. Notificar a la contraparte dentro del plazo pactado

Nunca alertar solo por la fecha de vencimiento del contrato en estos casos — la fecha
crítica es la del preaviso.

## Leyes de referencia

- **Uruguay**: CC arts. 1291 y ss. (contratos en general), CC art. 1841 (plazo), Ley 16.060
  arts. 1 y ss. (LSC — contratos societarios), Ley 17.250 (relaciones de consumo)
- **Argentina**: CCyCN arts. 960 y ss. (contratos), CCyCN arts. 1078 y ss. (extinción del
  contrato), CCyCN art. 1011 (contratos de duración)

## Guardrails

- **Calcular sobre la fecha límite para actuar, no sobre el vencimiento del contrato**:
  en contratos con preaviso, la fecha crítica es la del preaviso, no la del vencimiento.
- **Verificar el timezone de las fechas**: los plazos contractuales se cuentan según la
  jurisdicción del contrato; usar la hora local de la jurisdicción aplicable.
- **No renovar ni rescindir automáticamente**: el agente alerta y recomienda; la decisión
  y la acción son responsabilidad del abogado y el cliente.
- **Ante dato faltante en el registro**: si un contrato no tiene cargada la fecha de
  vencimiento o el tipo de vencimiento, clasificarlo como CRÍTICO y alertar al responsable
  para que complete los datos.
- **Notificar en canal `#contratos-vencimientos`** todos los lunes como mínimo, aunque
  no haya alertas activas (digest con "Sin vencimientos próximos esta semana").
