URGENTES — Acción en 6–15 días
[Mismo formato]

PRÓXIMOS — Acción en 16–30 días
[Tabla: Contrato | Contraparte | Tipo | Fecha límite | Acción | Responsable]

EN SEGUIMIENTO — Acción en 31–60 días
[Tabla compacta: Contrato | Contraparte | Fecha límite | Responsable]

